<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta · Kartooti</title>
  <link rel="icon" href="assets/img/logo-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pantallas.css">
</head>
<body>
  <header class="header header--simple">
    <a class="marca" href="index.html" aria-label="Kartooti, ir a la página de inicio">
      <img src="assets/img/logo.png" alt="">
      <span>Kartooti</span>
    </a>
  </header>

  <main class="acceso-pagina">
    <a class="btn-regresar" href="index.html"><img src="assets/icons/regresar.svg" width="41" height="15" alt="">Regresar</a>
    <div class="acceso-centro">
      <p class="acceso-centro__marca">Kartooti</p>
      <p class="acceso-centro__lema">Contigo desde el primer semestre</p>
      <div class="tarjeta-form tarjeta-form--celeste">
        <h1>Crear cuenta</h1>
        <form id="form-registro" novalidate>
          <label class="sr-only" for="r-nombre">Nombre completo</label>
          <input class="input" id="r-nombre" name="nombre" placeholder="Nombre completo" autocomplete="name" required>
          <label class="sr-only" for="r-correo">Correo electrónico</label>
          <input class="input" id="r-correo" name="correo" type="email" placeholder="Correo electrónico" autocomplete="email" required>
          <label class="sr-only" for="r-clave">Contraseña</label>
          <input class="input" id="r-clave" name="clave" type="password" placeholder="Contraseña" autocomplete="new-password" required>
          <label class="sr-only" for="r-clave2">Confirmar contraseña</label>
          <input class="input" id="r-clave2" name="clave2" type="password" placeholder="Confirmar contraseña" autocomplete="new-password" required>
          <p class="mensaje-error" id="r-error" role="alert"></p>
          <button class="btn btn--primario btn--bloque" type="submit">Registrarme</button>
        </form>
        <a class="enlace-centro" href="login.html">Volver al inicio de sesión</a>
      </div>
    </div>
  </main>

  <footer id="pie"></footer>
  <script src="js/app.js"></script>
  <script src="js/acceso.js"></script>
</body>
</html>
