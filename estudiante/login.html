<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartooti · Iniciar sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/inicio.css">
  <link rel="stylesheet" href="../css/estudiante.css">
</head>
<body>
  <main class="container">
    <a href="../index.html#acceso">← Volver</a>
    <h1>Iniciar sesión</h1>

    <form id="form-login">
      <label for="correo">Correo institucional</label>
      <input type="email" id="correo" name="correo" placeholder="usuario@unimilitar.edu.co" required>

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" name="clave" required>

      <p id="error" role="alert"></p>
      <button type="submit" class="btn btn--primary">Entrar</button>
    </form>
  </main>

  <script src="../js/estudiante/login.js"></script>
</body>
</html>
