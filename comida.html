<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicios de comida · Kartooti</title>
  <link rel="icon" href="assets/img/logo-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pantallas.css">
</head>
<body>
  <header id="encabezado"></header>

  <main class="contenedor pagina">
    <a class="btn-regresar" href="principal.html"><img src="assets/icons/regresar.svg" width="41" height="15" alt="">Regresar</a>
    <div class="pagina__titulo" style="margin-top:12px">
      <h1>Servicios de comida</h1>
      <p>Encuentra cafeterías y restaurantes en el campus</p>
    </div>
    <div class="comidas" id="lista-comidas"></div>

    <section class="consejos consejos--comida">
      <h2>Consejos rápidos</h2>
      <ul>
        <li>Las horas pico son típicamente de 12:00 PM - 1:30 PM</li>
        <li>Consulta el menú de cada lugar antes de ir</li>
        <li>Hay opciones veganas y vegetarianas disponibles en varios lugares</li>
      </ul>
    </section>
  </main>

  <!-- Ventana del menú -->
  <div class="modal" id="modal-menu" role="dialog" aria-modal="true" aria-label="Menú del restaurante" aria-hidden="true">
    <figure class="modal__caja menu-caja" style="margin:0">
      <button class="btn-cerrar" type="button" data-cerrar aria-label="Cerrar menú"><img src="assets/icons/cerrar-x.png" alt=""></button>
      <img id="menu-img" src="" alt="">
      <figcaption id="menu-nombre"></figcaption>
    </figure>
  </div>

  <footer id="pie"></footer>
  <script src="js/app.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/comida.js"></script>
</body>
</html>
